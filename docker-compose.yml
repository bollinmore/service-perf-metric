version: "3.8"
services:
  spm:
    build: .
    image: spm-app:latest
    ports:
      - "6231:6231"
    environment:
      - SPM_DEFAULT_DATASET=data
      - SPM_RESULT_BASE=/app/result
      - SPM_RESULT_ROOT=/app/result/data
    volumes:
      - ./data:/app/data
      - ./result:/app/result
      - ./recycle:/app/recycle
    restart: unless-stopped

